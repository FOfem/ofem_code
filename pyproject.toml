[build-system]
requires = [
    "setuptools>=61.0",
    "wheel>=0.40.0",
    "numpy>=1.21.0",
    "cython>=0.29.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "voiceforge"
version = "1.0.0"
description = "Personal Voice Model Training Studio"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
authors = [
    {name = "F.Ofem", email = "fofem@forracorp.com"}
]
dependencies = [
    "torch>=2.0.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.10.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "TTS>=0.14.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "pyinstaller>=5.0.0"
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["resources/**/*"]