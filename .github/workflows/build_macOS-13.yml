name: Build VoiceForge (Simplified)

on:
  release:
    types: [ created ]

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies (skip llvm issues)
      run: |
        # Use conda to avoid LLVM conflicts
        curl -L https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-arm64.sh -o miniforge.sh
        bash miniforge.sh -b -p $HOME/miniforge
        source $HOME/miniforge/bin/activate
        
        # Create environment
        conda create -n voiceforge python=3.11 -y
        conda activate voiceforge
        
        # Install with conda (handles LLVM automatically)
        conda install -c conda-forge llvmlite numba numpy scipy -y
        conda install -c conda-forge sounddevice soundfile -y
        pip install torch TTS pyinstaller
    
    - name: Build
      run: |
        source $HOME/miniforge/bin/activate
        conda activate voiceforge
        pyinstaller --name="VoiceForge" --windowed --onefile src/main.py
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-macOS
        path: dist/
