name: Build VoiceForge

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15-intel
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Configure system environment
      run: |
        echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
        echo "PIP_USE_PEP517=1" >> $GITHUB_ENV
        echo "PIP_NO_DEPS=0" >> $GITHUB_ENV
    
    - name: Install system dependencies (macOS)
      run: |
        brew update
        brew install portaudio libsndfile
        # Install LLVM 14 and set as primary
        brew install llvm@14
        # Clean up LLVM conflicts
        brew unlink llvm@18 || true
        brew unlink llvm || true
        # Force link LLVM 14
        brew link --force --overwrite llvm@14
        # Add to PATH
        echo "$(brew --prefix llvm@14)/bin" >> $GITHUB_PATH
    
    - name: Set LLVM environment variables
      run: |
        LLVM_PATH="$(brew --prefix llvm@14)"
        echo "LLVM_CONFIG=${LLVM_PATH}/bin/llvm-config" >> $GITHUB_ENV
        echo "LDFLAGS=-L${LLVM_PATH}/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I${LLVM_PATH}/include" >> $GITHUB_ENV
        echo "CXXFLAGS=-std=c++14" >> $GITHUB_ENV
        echo "CFLAGS=-std=c++14" >> $GITHUB_ENV
        echo "PATH=${LLVM_PATH}/bin:$PATH" >> $GITHUB_ENV
    
    - name: Verify LLVM installation
      run: |
        which llvm-config
        llvm-config --version
        llvm-config --libdir
    
    - name: Upgrade pip and build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade cython numpy
    
    - name: Install llvmlite with pre-built wheel
      run: |
        # Force install with specific version that has pre-built wheels
        pip install --no-deps --no-build-isolation llvmlite==0.43.0 || \
        pip install --only-binary=llvmlite llvmlite==0.43.0 || \
        pip install llvmlite
    
    - name: Install numba (requires llvmlite)
      run: |
        pip install numba --no-deps --no-build-isolation || \
        pip install numba
    
    - name: Install PyTorch (pre-built)
      run: |
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
    
    - name: Install remaining Python dependencies
      run: |
        # Install in specific order to avoid conflicts
        pip install sounddevice soundfile numpy scipy
        pip install pyyaml requests
        pip install TTS --no-deps
        pip install --upgrade TTS
        pip install pyinstaller pytest pytest-cov
    
    - name: Install application
      run: |
        pip install -e .
    
    - name: Verify installation
      run: |
        python -c "import torch; print(f'PyTorch version: {torch.__version__}')"
        python -c "import llvmlite; print(f'llvmlite version: {llvmlite.__version__}')"
        python -c "import TTS; print(f'TTS version: {TTS.__version__}')"
        python -c "import src; print('Application imported successfully')" || true
    
    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v --cov=src --cov-report=xml || echo "Tests skipped for now"
    
    - name: Build application with PyInstaller
      run: |
        # Create spec file for better control
        cat > VoiceForge.spec << EOF
        # -*- mode: python ; coding: utf-8 -*-
        
        block_cipher = None
        
        a = Analysis(
            ['src/main.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=[
                'tkinter',
                'sounddevice',
                'soundfile',
                'torch',
                'torch.nn',
                'TTS',
                'numpy',
                'scipy',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='VoiceForge',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon=None,
        )
        EOF
        
        pyinstaller VoiceForge.spec --clean --noconfirm
    
    - name: Validate build output
      run: |
        if [ -f dist/VoiceForge ]; then
          echo "✅ Build successful!"
          ls -la dist/
          file dist/VoiceForge
        else
          echo "❌ Build failed - no output file found"
          exit 1
        fi
    
    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-macOS-Intel
        path: dist/
        if-no-files-found: error