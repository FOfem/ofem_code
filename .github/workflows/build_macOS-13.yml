name: Build VoiceForge (macOS 13 / Intel)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15-intel
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Grant execution permissions to build scripts
      run: |
        chmod -R +x ./
    
    - name: Install system audio & LLVM dependencies (macOS)
      run: |
        brew update
        brew install portaudio libsndfile llvm@14
        brew unlink llvm || true
        brew link --force --overwrite llvm@14
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        
        LLVM_PREFIX="$(brew --prefix llvm@14)"
        export LLVM_CONFIG="${LLVM_PREFIX}/bin/llvm-config"
        export LDFLAGS="-L${LLVM_PREFIX}/lib"
        export CPPFLAGS="-I${LLVM_PREFIX}/include"
        export PATH="${LLVM_PREFIX}/bin:$PATH"
        
        pip install llvmlite --prefer-binary
        pip install -r requirements/prod.txt
        pip install pyinstaller pytest pytest-cov
        pip install -e .
    
    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Build macOS App Bundle & Executable with PyInstaller
      env:
        PYTHONPATH: .
      run: |
        pyinstaller --name="VoiceForge" --paths=src --windowed --onefile src/main.py
    
    - name: Grant execution permissions on output build
      run: |
        chmod +x dist/VoiceForge
    
    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-macOS-Intel-py3.11
        path: dist/
