name: Build VoiceForge (macOS 13 / Intel)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15-intel
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Grant execution permissions to build scripts
      run: |
        chmod -R +x ./
    
    - name: Install system audio & LLVM dependencies (macOS)
      run: |
        brew update
        brew install portaudio libsndfile llvm@14
        brew link --overwrite --force llvm@14
        echo "$(brew --prefix llvm@14)/bin" >> $GITHUB_PATH
    
    - name: Install Python dependencies
      env:
        LLVM_CONFIG: /usr/local/opt/llvm@14/bin/llvm-config
        LDFLAGS: "-L/usr/local/opt/llvm@14/lib"
        CPPFLAGS: "-I/usr/local/opt/llvm@14/include"
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --only-binary=:all: llvmlite || true
        pip install -r requirements/prod.txt
        pip install pyinstaller pytest pytest-cov
        pip install -e .
    
    - name: Run tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Build macOS App Bundle & Executable with PyInstaller
      env:
        PYTHONPATH: .
      run: |
        pyinstaller --name="VoiceForge" --paths=src --windowed --onefile src/main.py
    
    - name: Grant execution permissions on output build
      run: |
        chmod +x dist/VoiceForge
    
    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-macOS-Intel-py3.11
        path: dist/
