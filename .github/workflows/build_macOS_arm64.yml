name: macOS Apple Silicon Build (M1/M2/M3/M4)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build macOS App (Apple Silicon arm64)
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/prod.txt
        pip install pyinstaller Pillow

    - name: Install macOS Packaging Tooling
      run: brew install create-dmg

    - name: Generate High-Res App Icons
      run: python assets/generate_icons.py

    - name: Grant Executable Permissions
      run: chmod +x scripts/*.sh

    - name: Execute macOS Build Script
      shell: bash
      run: ./scripts/build_macos.sh

    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-macOS-AppleSilicon
        path: dist/VoiceForge-*.dmg